<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolutis Live Dashboard</title>
    <style>
        body { background-color: #1a1a2e; color: #eeeeee; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .header { margin-bottom: 20px; text-align: center; color: #888; font-size: 1.5em; }
        .footer { margin-top: 20px; color: #444; font-size: 1.2em; }
        img { max-width: 100%; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; border: 1px solid #333; }
        /* The desktop PNG is 7200px wide; on a phone that scales to ~1px text whatever the font size.
           Serve the narrow single-column render instead below 900px. */
        #dash_m { display: none; }
        @media (max-width: 900px) { #dash { display: none; } #dash_m { display: block; } }
    </style>
</head>
<body>
    <img id="dash" alt="Dashboard Rendering">
    <img id="dash_m" alt="Dashboard Rendering (mobile)">
    <div class="footer"><span id="ts"></span> — auto-refresh every 5m</div>
    <script>
        function refresh() {
            var img = document.getElementById('dash');
            var ts = Date.now();
            img.src = 'dashboard.png?t=' + ts;
            var imgm = document.getElementById('dash_m');
            if (imgm) imgm.src = 'dashboard_mobile.png?t=' + ts;
            document.getElementById('ts').textContent = 'Last checked: ' + new Date(ts).toUTCString();
        }
        refresh();
        setInterval(refresh, 300000);
    </script>
</body>
</html>
